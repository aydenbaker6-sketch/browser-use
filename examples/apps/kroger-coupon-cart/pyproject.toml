[project]
name = "kroger-coupon-cart"
version = "0.1.0"
description = "Build the cheapest Kroger cart that redeems all of your digital coupons"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "playwright>=1.45",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-httpserver>=1.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 130

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
